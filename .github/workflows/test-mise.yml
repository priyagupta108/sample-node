name: Test mise.toml support

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-mise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node from mise.toml
        uses: gperdomor/setup-node@feature/mise-support
        with:
          node-version-file: 'mise.toml'

      - name: Verify Node version
        run: |
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"
