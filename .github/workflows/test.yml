name: Reproduce npmrc issue
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm i -g npm@12   # or npm@latest, or npm@12.0.2 to pin exactly
